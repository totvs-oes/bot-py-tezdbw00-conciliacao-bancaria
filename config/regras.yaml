# Regras de classificação dos lançamentos do extrato.
#
# O histórico é normalizado antes da comparação: MAIÚSCULO, sem acento, espaços simples.
# As regras são avaliadas NA ORDEM; vale a primeira que casar.
# Lançamento que não casa com nenhuma regra = "nao_reconhecido" -> pendência (nunca é lançado).
#
# Campos de cada regra:
#   nome          identificador (aparece no relatório)
#   categoria     transferencia | contrapartida | consolidacao | tarifa | tarifa_agrupada | rendimento | fora_do_escopo
#                 | acao_manual (não lança; vira pendência com o motivo/acao da regra)
#   historico     regex (re.search) sobre o histórico normalizado, ou lista de regex (qualquer uma)
#   operacao      debito | credito (opcional = qualquer)
#   tipos_conta   tipos da conta do extrato (opcional = qualquer)
#   bancos        códigos COMPE (opcional = qualquer)
#   destino_tipo  (transferencia) tipo da conta destino no MESMO banco; a conta do extrato é a origem
#   origem_tipo   (transferencia) tipo da conta origem no MESMO banco; a conta do extrato é o destino
#   origem_conta  (consolidacao) chave da conta de origem
#   motivo/acao   (acao_manual) textos da pendência no relatório
#   historico_protheus  modelo do histórico gravado no Protheus (máx. 40 caracteres)
#                       {so}/{sd} = sigla do banco origem/destino, {to}/{td} = tipo abreviado

constantes:
  filial: "010101"
  natureza_transferencia: "2001037"
  natureza_tarifa: "2009028"
  natureza_rendimento: "1002002"
  tipo_mov_transferencia: "TB"
  numerario: "M1"
  historico_rendimento: "REND APLIC"
  beneficiario_transferencia: "AEROFLEX IND. DE AEROSOL LTDA"
  beneficiario_rendimento: "AEROFLEX"
  configuracao_conciliacao: "0024"
  historico_transferencia: "TRANSF {so} {to} P/ {sd} {td}"
  abreviacao_tipo:
    corrente: "C/C"
    caucao: "CAU"
    vinculada: "VINC"
    aplicacao: "APLIC"
    cambio: "CAMBIO"
    auxiliar: "AUX"

regras:
  # --- Santander: créditos de cobrança nas cauções -> base da transferência 29000181 -> caução (só no Protheus)
  - nome: consolidacao_santander
    categoria: consolidacao
    bancos: ["033"]
    tipos_conta: [caucao]
    operacao: credito
    historico: '^COBRANCA GARANTIA\b'
    origem_conta: santander_caucao_central
    historico_protheus: "TRANSF {so} CAU P/ {sd} CAU"

  # --- Liberação de caução / vinculada -> conta corrente. O lado DÉBITO (caução) é o dono.
  - nome: liberacao_caucao
    categoria: transferencia
    operacao: debito
    tipos_conta: [caucao, vinculada]
    historico: '\bTEG\b|TRANSF\.? ?EXCEDENTE|LIBERACAO DE (CONTA )?VINCULADA|SALDO VINCULADO LIBERADO|TRANSFERENCIA ENTRE C/?C|^TRANSF\b'
    destino_tipo: corrente

  # Mesmo movimento visto pela conta corrente (crédito): não lança, só confere o par.
  - nome: contrapartida_liberacao
    categoria: contrapartida
    operacao: credito
    tipos_conta: [corrente]
    # Caixa: a vinculada transfere como "TRANSF RECURSO AGENCIA" e o crédito chega na C/C como "CRED TEV" (10/09/2026)
    historico: '\bTEG\b|TRANSF\.? ?EXCEDENTE|LIBERACAO DE (CONTA )?VINCULADA|MESMA TITULARI|TRANSFERENCIA ENTRE C/?C|^CRED TEV\b'
    origem_tipo: [caucao, vinculada]

  # --- Itaú "KG": pagamento ligado ao Contas a Pagar; a baixa é manual (cliente, 05/10/2026). Não lançar.
  # --- Daycoval "AMORT. DE CONTRATO": amortização de empréstimo do Contas a Pagar; baixa manual (cliente, 05/10/2026)
  # --- BB "Cap Giro Dig Amortização" (15/09/2026): amortização de capital de giro, mesmo tratamento.
  - nome: amortizacao_contrato
    categoria: acao_manual
    bancos: ["707", "001"]
    operacao: debito
    historico: '^AMORT\.? DE CONTRATO\b|^CAP GIRO .*AMORTIZA'
    motivo: "Amortização de contrato (empréstimo) do Contas a Pagar (não é lançada pelo robô)."
    acao: "Fazer a baixa manual do título no Contas a Pagar; sem ela o saldo da conta não fecha na conciliação."

  - nome: kg_contas_a_pagar
    categoria: acao_manual
    bancos: ["341"]
    operacao: debito
    historico: '^KG\b'
    motivo: "Pagamento KG do Contas a Pagar (não é lançado pelo robô)."
    acao: "Fazer a baixa manual do título no Contas a Pagar; sem ela o saldo da conta não fecha na conciliação."

  # --- Aplicações financeiras (CC <-> conta aplicação)
  - nome: resgate_aplicacao
    categoria: transferencia
    operacao: credito
    tipos_conta: [corrente]
    historico: '\bRESGATE\b|^RES APLIC\b'
    origem_tipo: aplicacao
    historico_protheus: "TRANSF {so} RESGATE APLIC P/ {sd} CC"

  - nome: aplicacao
    categoria: transferencia
    operacao: debito
    tipos_conta: [corrente]
    historico: '^APLICACAO\b|^APLIC AUT\b|^APL APLIC AUT\b|\bAPLIC(ACAO)? (CDB|FINANCEIRA|CONTAMAX)'   # Itaú "APL APLIC AUT MAIS" (10/09)
    destino_tipo: aplicacao
    historico_protheus: "TRANSF {so} CC P/ {sd} APLIC"

  # --- Rendimento (sempre crédito em conta corrente)
  - nome: rendimento
    categoria: rendimento
    operacao: credito
    tipos_conta: [corrente]
    historico: '\bREND(E|IMENTO|IMENTOS)?\b'

  # --- Tarifas agrupadas: o valor NÃO é lançado; usa o extrato de tarifas detalhado.
  - nome: tarifa_agrupada_bb
    categoria: tarifa_agrupada
    bancos: ["001"]
    operacao: debito
    historico: 'TAR\.? AGRUPADAS'
  # Itaú "TAR/CUSTAS COBRANCA": agrupamento das tarifas de cobrança. A cliente confirmou (05/10/2026, 2ª resposta)
  # abrir pelo relatório de tarifas do Itaú ("TARIFAS ITAU", Movimentação de Títulos), como no BB. Sem detalhe que
  # some exatamente o valor da linha -> pendência (nunca lança o agrupado).
  - nome: tarifa_agrupada_itau
    categoria: tarifa_agrupada
    bancos: ["341"]
    operacao: debito
    historico: '^TAR/CUSTAS\b'

  # --- Tarifas individuais
  - nome: tarifa
    categoria: tarifa
    operacao: debito
    # Caixa: o código vem grudado ("COB ALT055", "COBPROT066"), por isso sem \b no fim desses dois
    historico: '\bTAR\b|\bTARIFA|\bCOB (LOTERI|AGENC|COMPE|ALT|BX|MAN|INTERN)|\bCOBPROT|DESPESAS? DE CARTORIO|DEBITO SERVICO COBRANCA|DEB\.? CUSTAS CARTOR|\bPACOTE PJ\b'

  # --- BB câmbio de exportação (10 e 15/09/2026): contrato, IOF e serviço de câmbio. Não lançar; tratamento a
  # confirmar com o Financeiro. Depois da regra de tarifa: "Tar Liquid Orpag Exterior" continua tarifa.
  - nome: cambio_bb
    categoria: acao_manual
    bancos: ["001"]
    historico: '\bCAMBIO\b'
    motivo: "Operação de câmbio (contrato de exportação, IOF ou serviço de câmbio): não é lançada pelo robô."
    acao: "Tratar manualmente conforme o processo de câmbio do Financeiro."

  # --- Fora do escopo do RPA (recebimentos, pagamentos, CNAB, impostos...). Só informativo.
  - nome: fora_do_escopo
    categoria: fora_do_escopo
    historico:   # lista = qualquer uma das expressões
      - '^COBRANCA$'
      - 'LIQUIDACAO DE COBRANCA|LIQUIDO DE COBRANCA|CR COB COMPENSACAO|RECEBIMENTO DE COBRANCA|CREDITO COBRANCA'
      - 'BOLETO RECEBIDO|^RECEBIMENTOS$'
      - '\bPIX (RECEBIDO|ENVIADO|QR CODE)|PIX RECEBIDO|^PIX - ENVIADO|PAGAMENTO PIX'
      - '^PAGAMENTOS\b|^SISPAG\b|^TED\b|TED ENVIADA|^PAGFOR\b'
      - '^DEV PAG BOL\b'   # Itaú: estorno de pagamento recusado pelo banco; sem ação (cliente, 05/10/2026)
      - '^IMPOSTOS\b|^CONTR IMP\b|PRESTACAO CONSORCIO|DEBITO AUT(\.|OMATICO\b)'
      - '^PAGAMENTO DE BOLETO\b|PAGAMENTO DE SALARIO|^ENVIO TED\b'   # pagamentos (10/09/2026)
      - '^COB (INTERN|COMPE|LOT|AGENC)'   # Caixa vinculada: créditos de cobrança (os débitos já caíram em tarifa)
