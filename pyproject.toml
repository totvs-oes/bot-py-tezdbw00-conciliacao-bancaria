[project]
name = "conciliacao-rpa"
version = "0.1.0"
description = "RPA de Conciliação Bancária AEROFLEX: extratos -> lançamentos e conciliação no Protheus"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conciliacao*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
